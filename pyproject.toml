[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnspider"
version = "0.1.0"
description = "Input-point-based web vulnerability candidate prioritization prototype."
readme = "README_START_HERE.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vulnspider = "vulnspider.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

